<!DOCTYPE html>
<html>
<body>
    <canvas id="c" style="display:none;"></canvas>
    <h1 id="out" style="font-family: sans-serif;">Loading Logo Colors...</h1>
    <script>
        var img = new Image();
        img.src = 'img/logo.png';
        img.onload = function() {
            var c = document.getElementById('c');
            var ctx = c.getContext('2d');
            c.width = img.width; c.height = img.height;
            ctx.drawImage(img, 0, 0);
            var data = ctx.getImageData(0, 0, c.width, c.height).data;
            var counts = {};
            for(var i=0; i<data.length; i+=16) {
                if(data[i+3] > 100){ // skip transparent
                    var hex = '#' + 
                        ('0' + data[i].toString(16)).slice(-2) + 
                        ('0' + data[i+1].toString(16)).slice(-2) + 
                        ('0' + data[i+2].toString(16)).slice(-2);
                    counts[hex] = (counts[hex] || 0) + 1;
                }
            }
            var sortable = [];
            for (var h in counts) sortable.push([h, counts[h]]);
            sortable.sort(function(a, b) { return b[1] - a[1] });
            document.getElementById('out').innerText = 'TOP COLORS: ' + sortable.slice(0, 5).map(x => x[0]).join(', ');
        }
    </script>
</body>
</html>
